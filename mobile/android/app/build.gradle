apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    namespace "com.tripconnect"

    // Enable buildConfig feature (required in AGP 8.0+)
    buildFeatures {
        buildConfig true
    }

    // Read the newArchEnabled and hermesEnabled flags from gradle.properties
    def enableNewArchitecture = project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
    def enableHermes = project.hasProperty("hermesEnabled") && project.hermesEnabled == "true"

    defaultConfig {
        applicationId "com.tripconnect"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", enableNewArchitecture.toString()
        buildConfigField "boolean", "IS_HERMES_ENABLED", enableHermes.toString()
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// Configure Kotlin options outside the android block
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "11"
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "com.facebook.react:react-android:0.73.11"
    implementation "com.facebook.react:hermes-android:0.73.11"
    
    // AndroidX dependencies - versions are forced via resolutionStrategy in root build.gradle
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core:1.12.0"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "com.google.android.material:material:1.9.0"
}
