buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "25.1.8937393"
        kotlinVersion = "1.9.24"
        reactNativeVersion = "0.76.6"
    }
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

// Repositories are now configured in settings.gradle for Gradle 9.0 compatibility
// The allprojects block is deprecated and will be removed in Gradle 9.0

subprojects {
    // Configure repositories and dependencies early for React Native libraries
    configurations.all {
        resolutionStrategy {
            // Force react-android version globally
            force "com.facebook.react:react-android:${rootProject.ext.reactNativeVersion}"
        }
    }
    
    afterEvaluate { project ->
        // Fix for packages that reference com.facebook.react:react-native:+ which doesn't exist
        // In RN 0.73, we use com.facebook.react:react-android instead
        if (project.hasProperty("android")) {
            // CRITICAL: Ensure React Native libraries have react-android dependency
            // This fixes "Unresolved reference: BaseReactPackage" and "ViewManagerWithGeneratedInterface" errors
            if (project.name.contains("react-native") && project.name != "react-native") {
                // Add react-android dependency - must be available during Kotlin compilation
                // Add to multiple configurations to ensure it's on compile classpath
                project.dependencies {
                    // Add to implementation (most common)
                    add("implementation", "com.facebook.react:react-android:${rootProject.ext.reactNativeVersion}")
                    // Also add to api if it exists (for Android libraries)
                    def apiConfig = project.configurations.findByName("api")
                    if (apiConfig != null) {
                        add("api", "com.facebook.react:react-android:${rootProject.ext.reactNativeVersion}")
                    }
                }
                
                // Also ensure it's directly on compile classpath
                try {
                    def compileClasspath = project.configurations.findByName("compileClasspath")
                    if (compileClasspath != null) {
                        compileClasspath.dependencies.add(
                            project.dependencies.create("com.facebook.react:react-android:${rootProject.ext.reactNativeVersion}")
                        )
                    }
                } catch (Exception e) {
                    // Configuration might not be ready, that's okay
                }
            }
            
            project.android {
                // Ensure compileSdk is set for all subprojects
                // Use compileSdk instead of deprecated compileSdkVersion (AGP 8.0+)
                try {
                    def currentCompileSdk = compileSdk
                    if (currentCompileSdk == null) {
                        compileSdk rootProject.ext.compileSdkVersion
                    }
                } catch (Exception e) {
                    // Fallback for older projects that might not support compileSdk property
                    try {
                        if (!project.android.hasProperty("compileSdkVersion") || project.android.compileSdkVersion == null) {
                            compileSdk rootProject.ext.compileSdkVersion
                        }
                    } catch (Exception e2) {
                        // Some projects might have different structure, ignore
                    }
                }
                // Set namespace if not already specified (required for AGP 8.0+)
                // This fixes: "Namespace not specified" error for libraries like react-native-date-picker
                try {
                    def existingNs = null
                    try {
                        existingNs = namespace
                    } catch (Exception e) {
                        // Namespace not set
                    }
                    
                    if (existingNs == null || existingNs.isEmpty()) {
                        // Try to extract namespace from AndroidManifest.xml
                        def manifestFile = project.file("src/main/AndroidManifest.xml")
                        if (!manifestFile.exists()) {
                            manifestFile = project.file("AndroidManifest.xml")
                        }
                        
                        def namespaceValue = null
                        if (manifestFile.exists()) {
                            def manifestContent = manifestFile.text
                            def packageMatch = manifestContent =~ /package=["']([^"']+)["']/
                            if (packageMatch.find()) {
                                namespaceValue = packageMatch.group(1)
                            }
                        }
                        
                        // Fallback: generate namespace from project name or use common React Native library pattern
                        if (namespaceValue == null) {
                            def projectName = project.name
                            // Handle react-native-date-picker specifically
                            if (projectName == "react-native-date-picker") {
                                namespaceValue = "com.henninghall.datepicker"
                            } else {
                                // Convert project name to valid namespace
                                projectName = projectName.replaceAll(/[^a-zA-Z0-9]/, '')
                                namespaceValue = "com.${projectName.toLowerCase()}"
                            }
                        }
                        
                        // Set namespace
                        namespace = namespaceValue
                    }
                } catch (Exception e) {
                    // Some projects might have different structure, ignore
                }
                
                // Enable buildConfig for all subprojects (required for libraries like react-native-date-picker)
                // This fixes: "defaultConfig contains custom BuildConfig fields, but the feature is disabled"
                buildFeatures {
                    buildConfig true
                }
                
                // Set consistent Java compatibility for all subprojects
                // This fixes: "compileDebugJavaWithJavac and compileDebugKotlin jvm target compatibility" errors
                // Using Java 17 as it's required by newer React Native libraries and AGP 8.1.4
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
            
            // Set Kotlin JVM target to match Java (17)
            // This ensures Kotlin and Java compile to the same bytecode version
            // Using compilerOptions API instead of deprecated kotlinOptions closure
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                compilerOptions {
                    jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                    // Add compiler arguments for better compatibility
                    freeCompilerArgs.addAll([
                        "-Xjvm-default=all",
                        "-opt-in=kotlin.RequiresOptIn"
                    ])
                    // Suppress warnings that might cause build failures
                    allWarningsAsErrors.set(false)
                }
            }
            
            
            project.configurations.all {
                resolutionStrategy {
                    // Force react-android version
                    force "com.facebook.react:react-android:${rootProject.ext.reactNativeVersion}"
                    
                    // Force compatible AndroidX versions for SDK 35
                    force "androidx.core:core:1.13.1"
                    force "androidx.core:core-ktx:1.13.1"
                    force "androidx.appcompat:appcompat:1.7.0"
                    force "androidx.appcompat:appcompat-resources:1.7.0"
                    force "androidx.annotation:annotation-experimental:1.4.0"
                    force "androidx.core:core-viewtree:1.0.0"
                    
                    // Substitute react-native dependency with react-android
                    eachDependency { details ->
                        if (details.requested.group == 'com.facebook.react' && details.requested.name == 'react-native') {
                            details.useTarget group: 'com.facebook.react', name: 'react-android', version: "${rootProject.ext.reactNativeVersion}"
                            details.because "react-native is not published as a Maven artifact in RN 0.73, use react-android instead"
                        }
                    }
                }
            }
        }
    }
}
